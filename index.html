<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooking Dash - Nhà Hàng Đẳng Cấp</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #121212;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #fff;
            user-select: none;
        }
        #gameCanvas {
            border: 4px solid #d4ac0d;
            border-radius: 12px;
            background: #2c1e12;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        #instruction {
            margin-top: 10px;
            background: #1f2c34;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            border: 2px dashed #f39c12;
            text-align: center;
            max-width: 880px;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="880" height="540"></canvas>
    <div id="instruction"><b>HƯỚNG DẪN:</b> Click vào <b>Máy Nước (Trái)</b>, <b>Khay Bánh (Giữa)</b> hoặc <b>Bếp Nướng Sườn (Phải)</b> để lấy món -> Sau đó click vào <b>Khách Hàng (Phía trên)</b> có bong bóng gọi món tương ứng để phục vụ kiếm điểm và tiền vàng!</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Thông số giao diện giống ảnh mẫu
        let level = 13;
        let coins = 265;
        let xp = 546;
        let score = 0;

        let holdingItem = 'Tay không';

        // Danh sách khách hàng (3 bàn phía trên)
        let customers = [
            { id: 0, avatar: '👨‍💼', order1: 'Sườn Nướng 🥩', order2: 'Nước Suối 💧', maxTime: 120, time: 120, active: true },
            { id: 1, avatar: '👩‍🦰', order1: 'Bánh Pretzel 🥨', order2: null, maxTime: 90, time: 90, active: true },
            { id: 2, avatar: '👦', order1: 'Bít Tếch 🍖', order2: 'Nước Suối 💧', maxTime: 100, time: 100, active: true }
        ];

        // Lắng nghe sự kiện click chuột tương tác quầy bếp & phục vụ khách
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // 1. Tương tác với Máy Nước (Bên trái: x từ 40 đến 220, y từ 300 đến 480)
            if (x >= 40 && x <= 220 && y >= 300 && y <= 480) {
                holdingItem = 'Nước Suối 💧';
            }
            // 2. Tương tác với Khay Bánh & Đồ Ăn Nhẹ (Ở giữa: x từ 240 đến 400)
            else if (x >= 240 && x <= 400 && y >= 300 && y <= 480) {
                holdingItem = 'Bánh Pretzel 🥨';
            }
            // 3. Tương tác với Bếp Nướng Thịt / Sườn (Bên phải: x từ 630 đến 840)
            else if (x >= 630 && x <= 840 && y >= 300 && y <= 480) {
                holdingItem = Math.random() > 0.5 ? 'Sườn Nướng 🥩' : 'Bít Tếch 🍖';
            }

            // 4. Tương tác phục vụ khách hàng (Khu vực y từ 60 đến 200)
            if (y >= 60 && y <= 210) {
                let slotWidth = canvas.width / 3;
                let clickedSlot = Math.floor(x / slotWidth);

                if (clickedSlot >= 0 && clickedSlot < 3 && customers[clickedSlot].active) {
                    let cust = customers[clickedSlot];
                    // Nếu món đang cầm khớp với order1 hoặc order2 của khách
                    if (holdingItem === cust.order1 || holdingItem === cust.order2) {
                        coins += 15;
                        score += 30;
                        xp += 10;
                        holdingItem = 'Tay không';

                        // Khách nhận xong món -> rời đi, tạo khách mới sau 2 giây
                        customers[clickedSlot].active = false;
                        setTimeout(() => {
                            let dishes = ['Sườn Nướng 🥩', 'Bánh Pretzel 🥨', 'Bít Tếch 🍖'];
                            let drinks = ['Nước Suối 💧', null];
                            customers[clickedSlot] = {
                                id: clickedSlot,
                                avatar: ['👨‍💼', '👩‍🦰', '👦', '🧔', '👩‍🦱'][Math.floor(Math.random() * 5)],
                                order1: dishes[Math.floor(Math.random() * dishes.length)],
                                order2: drinks[Math.floor(Math.random() * drinks.length)],
                                maxTime: 110,
                                time: 110,
                                active: true
                            };
                        }, 1800);
                    }
                }
            }
        });

        function update() {
            // Giảm thanh kiên nhẫn của khách theo thời gian thực
            for (let i = 0; i < 3; i++) {
                if (customers[i].active) {
                    customers[i].time -= 0.07;
                    if (customers[i].time <= 0) {
                        // Hết giờ khách giận dữ bỏ đi
                        customers[i].time = customers[i].maxTime;
                        coins = Math.max(0, coins - 10);
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ================= 1. THANH HEADER (GIỐNG HỆT ẢNH MẪU) =================
            ctx.fillStyle = '#1a110a';
            ctx.fillRect(0, 0, canvas.width, 50);

            // Nút Menu & Level
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 14px Arial';
            ctx.fillText('📋 MENU', 25, 30);
            ctx.fillText(`👥 Level ${level}`, 110, 30);

            // Ô Tiền Vàng (Coins)
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(300, 10, 110, 30);
            ctx.fillStyle = '#fff';
            ctx.fillText(`🪙 ${coins}`, 320, 30);

            // Thanh XP (Kinh nghiệm)
            ctx.fillStyle = '#2980b9';
            ctx.fillRect(570, 15, 240, 18);
            ctx.fillStyle = '#fff';
            ctx.font = '12px Arial';
            ctx.fillText(`XP: ${xp} / 1000`, 640, 29);


            // ================= 2. KHU VỰC KHÁCH HÀNG & BONG BÓNG GỌI MÓN =================
            let slotWidth = canvas.width / 3;
            for (let i = 0; i < 3; i++) {
                let cust = customers[i];
                let startX = i * slotWidth;

                // Nền khu bàn khách
                ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.fillRect(startX + 15, 60, slotWidth - 30, 145);
                ctx.strokeStyle = '#5d4037';
                ctx.lineWidth = 2;
                ctx.strokeRect(startX + 15, 60, slotWidth - 30, 145);

                if (cust && cust.active) {
                    // Avatar nhân vật khách
                    ctx.font = '42px Arial';
                    ctx.fillText(cust.avatar, startX + slotWidth / 2 - 20, 115);

                    // Bong bóng hội thoại gọi món
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.roundRect(startX + 25, 122, slotWidth - 50, 52, 8);
                    ctx.fill();
                    ctx.strokeStyle = '#e74c3c';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // Tên món ăn trong bóng thoại
                    ctx.fillStyle = '#222';
                    ctx.font = 'bold 11px Arial';
                    ctx.fillText(`• ${cust.order1}`, startX + 33, 142);
                    if (cust.order2) {
                        ctx.fillText(`• ${cust.order2}`, startX + 33, 161);
                    }

                    // Thanh thời gian kiên nhẫn (Timer Bar)
                    ctx.fillStyle = '#ddd';
                    ctx.fillRect(startX + 25, 182, slotWidth - 50, 6);
                    ctx.fillStyle = cust.time > 35 ? '#2ecc71' : '#e74c3c';
                    ctx.fillRect(startX + 25, 182, (slotWidth - 50) * (cust.time / cust.maxTime), 6);
                } else {
                    ctx.fillStyle = '#888';
                    ctx.font = '13px Arial';
                    ctx.fillText('Đang chuẩn bị...', startX + slotWidth / 2 - 45, 135);
                }
            }


            // ================= 3. QUẦY BẾP VÀ TRẠM NẤU (PHÍA DƯỚI) =================
            // Mặt quầy gỗ sang trọng
            ctx.fillStyle = '#b94e00';
            ctx.fillRect(0, 260, canvas.width, 280);
            ctx.fillStyle = '#d35400';
            ctx.fillRect(0, 260, canvas.width, 15);

            // --- TRẠM 1: MÁY NƯỚC (BÊN TRÁI) ---
            ctx.fillStyle = '#34495e';
            ctx.fillRect(40, 290, 180, 215);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2;
            ctx.strokeRect(40, 290, 180, 215);
            ctx.fillStyle = '#f1c40f';
            ctx.font = 'bold 13px Arial';
            ctx.fillText('🥤 MÁY NƯỚC SUỐI', 60, 315);
            // Nút bấm máy nước
            ctx.fillStyle = '#3498db';
            ctx.fillRect(55, 340, 150, 140);
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('Click lấy Nước Suối', 72, 415);

            // --- TRẠM 2: KHAY BÁNH VÒNG PRETZEL (Ở GIỮA) ---
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(240, 290, 165, 215);
            ctx.strokeRect(240, 290, 165, 215);
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('🥨 KHAY BÁNH NGỌT', 255, 315);
            // Khay bánh
            ctx.fillStyle = '#d35400';
            ctx.fillRect(255, 340, 135, 140);
            ctx.fillStyle = '#fff';
            ctx.fillText('Click lấy Bánh', 280, 415);

            // --- TRẠM 3: BẾP NƯỚNG THỊT / SƯỜN (BÊN PHẢI) ---
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(630, 290, 210, 215);
            ctx.strokeRect(630, 290, 210, 215);
            ctx.fillStyle = '#f1c40f';
            ctx.fillText('🔥 BẾP NƯỚNG SƯỜN & BÍT TÉCH', 638, 315);
            // Lò nướng xèo xèo
            ctx.fillStyle = '#c0392b';
            ctx.fillRect(645, 340, 180, 140);
            ctx.fillStyle = '#fff';
            ctx.fillText('Click nướng Sườn / Bít Tếch', 655, 415);


            // ================= 4. KHUNG HIỂN THỊ ĐỒ TRÊN TAY =================
            ctx.fillStyle = '#111';
            ctx.fillRect(425, 450, 190, 45);
            ctx.strokeStyle = '#f1c40f';
            ctx.lineWidth = 2;
            ctx.strokeRect(425, 450, 190, 45);

            ctx.fillStyle = '#00ffff';
            ctx.font = 'bold 13px Arial';
            ctx.fillText(`Trên tay: ${holdingItem}`, 438, 478);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
